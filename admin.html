<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Arovia HQ | Admin Dashboard</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        admin: {
                            bg: '#050505',
                            card: '#111111',
                            gold: '#C5A059',
                            goldHover: '#dcb871',
                            border: '#222222',
                            input: '#151515',
                            purple: '#2d1445',
                            purpleText: '#a476db',
                            red: '#cc3333'
                        }
                    },
                    fontFamily: {
                        serif: ['Cinzel', 'serif'],
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <style>
        body { background-color: #050505; color: #e5e5e5; }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #050505; }
        ::-webkit-scrollbar-thumb { background: #222; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #C5A059; }
        select { appearance: none; }
        .select-arrow { pointer-events: none; }
    </style>
</head>
<body class="font-sans antialiased min-h-screen flex flex-col">

    <div id="auth-view" class="flex-1 flex items-center justify-center p-4">
        <div class="bg-admin-card border border-admin-border rounded-md p-8 w-full max-w-sm shadow-2xl flex flex-col items-center">
            <i class="fa-solid fa-lock text-admin-gold text-3xl mb-4 opacity-80"></i>
            <h2 class="font-serif text-xl tracking-[0.2em] text-white mb-8 uppercase text-center">Restricted Access</h2>
            
            <form id="login-form" class="w-full space-y-4" onsubmit="handleLogin(event)">
                <input type="email" id="admin-email" placeholder="Enter Admin Email" required
                    class="w-full bg-admin-input border border-[#333] rounded px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-admin-gold transition">
                
                <input type="password" id="admin-code" placeholder="Enter Password" required
                    class="w-full bg-admin-input border border-[#333] rounded px-4 py-3 text-sm text-white placeholder-gray-600 focus:outline-none focus:border-admin-gold transition">
                
                <button type="submit" 
                    class="w-full border border-admin-gold text-admin-gold font-serif tracking-widest text-sm py-3 mt-4 hover:bg-admin-gold hover:text-black transition-colors duration-300">
                    AUTHENTICATE
                </button>
            </form>
        </div>
    </div>

    <div id="dashboard-view" class="hidden flex-1 flex-col h-screen overflow-hidden">
        <nav class="border-b border-admin-border bg-admin-card px-4 py-4 flex justify-between items-center sticky top-0 z-50">
            <h1 class="font-serif text-2xl font-bold text-admin-gold tracking-[0.15em]">AROVIA HQ</h1>
            <button onclick="logout()" class="border border-[#333] text-gray-400 hover:text-white hover:border-white px-3 py-1.5 text-xs tracking-widest flex items-center gap-2 transition rounded-sm">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> EXIT
            </button>
        </nav>

        <main class="flex-1 overflow-y-auto p-4 md:p-6 w-full max-w-3xl mx-auto">
            <div class="flex justify-between items-end mb-8 border-b border-admin-border pb-4">
                <div>
                    <h2 class="font-serif text-3xl text-white tracking-[0.1em] mb-1">LIVE ORDERS</h2>
                    <p class="text-[10px] text-gray-500 tracking-[0.2em] uppercase">Real-Time Database Sync Active</p>
                </div>
                <div class="text-admin-gold animate-pulse text-xs tracking-widest font-mono">LIVE SYNC ON</div>
            </div>
            <div id="orders-container" class="space-y-6"></div>
        </main>
    </div>

    <!-- Firebase SDKs -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, onSnapshot, doc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyD6EiuBr54PEA0IIj5g6r6UqGi...",
            authDomain: "arovia-tech.firebaseapp.com",
            projectId: "arovia-tech",
            storageBucket: "arovia-tech.firebasestorage.app",
            messagingSenderId: "717183346666",
            appId: "1:717183346666:web:e23d0570aa50e84e6f493",
            measurementId: "G-0VRGEY8B85"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);

        window.firebaseAuth = auth;
        window.firebaseDb = db;
        window.firestoreFns = { collection, onSnapshot, doc, updateDoc, deleteDoc, signInWithEmailAndPassword, signOut };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-view').classList.add('hidden');
                document.getElementById('dashboard-view').classList.remove('hidden');
                document.getElementById('dashboard-view').classList.add('flex');
                initRealtimeListener(db);
            }
        });
    </script>

    <script>
        let liveOrders = [];
        let unsubscribe = null;

        async function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('admin-email').value;
            const pass = document.getElementById('admin-code').value;
            try {
                await window.firestoreFns.signInWithEmailAndPassword(window.firebaseAuth, email, pass);
            } catch (err) {
                alert("Authentication Failed: " + err.message);
            }
        }

        async function logout() {
            if (unsubscribe) unsubscribe();
            await window.firestoreFns.signOut(window.firebaseAuth);
            document.getElementById('dashboard-view').classList.add('hidden');
            document.getElementById('dashboard-view').classList.remove('flex');
            document.getElementById('auth-view').classList.remove('hidden');
        }

        function initRealtimeListener(db) {
            const { collection, onSnapshot } = window.firestoreFns;
            unsubscribe = onSnapshot(collection(db, "orders"), (snapshot) => {
                liveOrders = [];
                snapshot.forEach((docSnap) => {
                    liveOrders.push({ docId: docSnap.id, ...docSnap.data() });
                });
                liveOrders.sort((a, b) => new Date(b.createdAt || 0) - new Date(a.createdAt || 0));
                renderOrders();
            });
        }

        const STATUS_COLORS = {
            'VERIFY PENDING': 'text-admin-red',
            'PAYMENT VERIFIED': 'text-admin-gold',
            'IN WORKSHOP': 'text-blue-400',
            'SHIPPED': 'text-orange-400',
            'DELIVERED': 'text-green-500'
        };

        function renderOrders() {
            const container = document.getElementById('orders-container');
            container.innerHTML = '';
            
            if (liveOrders.length === 0) {
                container.innerHTML = `<p class="text-center text-gray-500 font-serif tracking-widest mt-12">No Active Orders in Database</p>`;
                return;
            }

            liveOrders.forEach((order, index) => {
                const statusColor = STATUS_COLORS[order.status] || 'text-gray-400';
                const card = document.createElement('div');
                card.className = 'bg-admin-card border border-admin-border rounded-md p-5 flex flex-col gap-4 shadow-lg relative';
                
                card.innerHTML = `
                    <div class="flex justify-between items-start border-b border-[#222] pb-4">
                        <div>
                            <span class="bg-[#222] text-admin-gold text-[10px] font-bold px-2 py-1 rounded-sm tracking-widest">${order.id}</span>
                            <p class="text-xs text-gray-500 mt-2 tracking-wide">${order.date}</p>
                        </div>
                        <div class="text-right">
                            <span class="text-xl font-medium text-white">₹${order.total}</span>
                            <div class="flex items-center gap-1.5 justify-end mt-1 text-[10px] font-bold tracking-widest uppercase ${statusColor}">
                                <div class="w-1.5 h-1.5 rounded-full bg-current"></div>
                                ${order.status}
                            </div>
                        </div>
                    </div>
                    <div class="space-y-2 text-sm text-gray-400 mt-2">
                        <div class="flex items-center gap-3"><i class="fa-regular fa-user text-admin-gold w-4"></i> <span class="text-white">${order.customer.name}</span></div>
                        <div class="flex items-center gap-3"><i class="fa-regular fa-envelope text-admin-gold w-4"></i> <span>${order.customer.email}</span></div>
                        <div class="flex items-center gap-3"><i class="fa-solid fa-phone text-admin-gold w-4"></i> <span>${order.customer.phone}</span></div>
                        <div class="flex items-start gap-3"><i class="fa-solid fa-location-dot text-admin-gold w-4 mt-1"></i> <span class="leading-snug">${order.customer.address}</span></div>
                    </div>
                    <div>
                        <span class="inline-flex items-center gap-1.5 bg-admin-purple border border-[#45276b] text-admin-purpleText text-[10px] font-bold px-2 py-1 rounded-sm tracking-widest">
                            <i class="fa-solid fa-bolt"></i> UPI (${order.upiRef})
                        </span>
                    </div>
                    <div class="mt-2">
                        <p class="text-[10px] text-gray-500 tracking-[0.1em] uppercase mb-2">Purchased Items:</p>
                        <div class="bg-[#151515] border border-[#222] rounded-sm p-3 space-y-2">
                            ${order.items.map(item => `<p class="text-xs text-gray-300 font-medium">${item}</p>`).join('')}
                        </div>
                    </div>
                    <div class="flex flex-col sm:flex-row gap-3 mt-2 border-t border-[#222] pt-4">
                        <div class="relative flex-1">
                            <select id="status-${index}" class="w-full bg-[#151515] border border-[#333] text-gray-300 text-xs font-bold tracking-widest uppercase p-3 rounded-sm focus:outline-none focus:border-admin-gold cursor-pointer appearance-none">
                                <option value="VERIFY PENDING" ${order.status === 'VERIFY PENDING' ? 'selected' : ''}>VERIFY PENDING</option>
                                <option value="PAYMENT VERIFIED" ${order.status === 'PAYMENT VERIFIED' ? 'selected' : ''}>PAYMENT VERIFIED</option>
                                <option value="IN WORKSHOP" ${order.status === 'IN WORKSHOP' ? 'selected' : ''}>IN WORKSHOP</option>
                                <option value="SHIPPED" ${order.status === 'SHIPPED' ? 'selected' : ''}>SHIPPED</option>
                                <option value="DELIVERED" ${order.status === 'DELIVERED' ? 'selected' : ''}>DELIVERED</option>
                            </select>
                            <i class="fa-solid fa-chevron-down absolute right-4 top-1/2 -translate-y-1/2 text-gray-500 text-xs select-arrow"></i>
                        </div>
                        <div class="flex gap-2">
                            <button onclick="updateOrderStatus('${order.docId}', ${index})" class="flex-1 sm:flex-none border border-[#333] text-admin-gold bg-[#151515] hover:border-admin-gold px-6 py-3 rounded-sm text-xs font-bold tracking-widest transition-colors">UPDATE</button>
                            <button onclick="deleteOrderDoc('${order.docId}')" class="border border-admin-red/30 text-admin-red bg-[#1a0f0f] hover:bg-admin-red hover:text-white px-4 py-3 rounded-sm transition-colors" title="Delete Order"><i class="fa-regular fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }

        window.updateOrderStatus = async function(docId, index) {
            const selectEl = document.getElementById(`status-${index}`);
            const newStatus = selectEl.value;
            const { doc, updateDoc } = window.firestoreFns;
            try {
                await updateDoc(doc(window.firebaseDb, "orders", docId), { status: newStatus });
                alert("Order status updated successfully!");
            } catch (err) {
                alert("Error updating status: " + err.message);
            }
        };

        window.deleteOrderDoc = async function(docId) {
            if(confirm('Permanently delete this order from the database?')) {
                const { doc, deleteDoc } = window.firestoreFns;
                try {
                    await deleteDoc(doc(window.firebaseDb, "orders", docId));
                } catch (err) {
                    alert("Error deleting order: " + err.message);
                }
            }
        };
    </script>
</body>
</html>
